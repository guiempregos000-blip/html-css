<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test of background image</title>
    <style>
        :root {
            --image001: url('images/wallpaper005.jpg');
        }

        body {
            text-align: center;
            background-image: url('images/wallpaper001.jpg');
        }

        main {
            background-image: url('images/wallpaper004.jpg');
            margin: 20px;
            padding: 20px;
            border-radius: 15px;
        }

        div.quadrado {
            display: inline-block;
            border: 1px solid black;
            border-radius: 10px;
            background-color: gray;
            width: 300px;
            height: 300px;
        }

        div#q1 {
            background-color: skyblue;
        }

        div#q2 {
            background-image: linear-gradient( to bottom , yellow, red);
        }
        
        div#q3 {
            background-image: url('images/pattern003.png');
        }

        div#q4 {
            background-image: url('images/pattern004.png');
        }

        div#q5 {
            background-image: var(--image001);
        }

    </style>
</head>
<body>
    <main>
        <div class="quadrado" id="q1">
        </div>
        <div class="quadrado" id="q2">
        </div>
        <div class="quadrado" id="q3">
        </div>
        <div class="quadrado" id="q4">
        </div>
        <div class="quadrado" id="q5">
        </div>
    </main>
</body>
</html>
