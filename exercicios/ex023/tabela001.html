<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sheet</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            width: 400px;
            height: 400px;
            border-collapse: collapse;
        }

        td {
            text-align: center;
            vertical-align: middle;
            border: 1px solid black;
            padding: 8px;
        }

        td.right {
            text-align: right;
            vertical-align: top;
        }
    </style>
</head>
<body>
    <h1>
        My first sheet
    </h1>
    <!--
        Hierarchy's Sheet tag
        TABLE <table>
            TABLE ROW <tr>
            TABLE HEADER
            TABLE DATA <td>
    -->
    <table>
        <tr> <!--First Line-->
            <td>A1</td>
            <td>B1</td>
            <td>C1</td>
        </tr>
        <tr>
            <td>A2</td>
            <td>B2</td>
            <td class="right">C2</td>
        </tr>
        <tr>
            <td>A3</td>
            <td>B3</td>
            <td class="right">C3</td>
        </tr>
        <tr>
            <td>A4</td>
            <td>B4</td>
            <td>C4</td>
        </tr>
    </table>
</body>
</html>
