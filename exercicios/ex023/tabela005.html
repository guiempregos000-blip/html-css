<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio de tabela</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            width: 500px;
            border-collapse: collapse;
        }

        caption {
            font-size: 1.3em;
            font-weight: bolder;
            padding: 8px;
        }

        th, td {
            border: 1px solid black;
            padding: 8px;
        }

        .cnome {
            background-color: orange;
        }

        .cgrupo1 {
            background-color: yellowgreen;
        }
    </style>
</head>
<body>
    <h1>
        Exercicio de tabela
    </h1>
    <table>
        <colgroup>
            <col class="cnome">
            <col class="cgrupo1" span="2">
            <col class="cprof">
        </colgroup>
        <caption>Cadastro</caption>
        <tr>
            <th scope="col">Nome</th>
            <th scope="col">Sexo</th>
            <th scope="col">Idade</th>
            <th scope="col">Profissão</th>
        </tr>
        <tr>
            <td>Ana Maria</td>
            <td>F</td>
            <td>25 anos</td>
            <td>Jornalista</td>
        </tr>
        <tr>
            <td>Sarah Lima</td>
            <td>F</td>
            <td>21 anos</td>
            <td>Psicologa</td>
        </tr>
        <tr>
            <td>Jorge tom</td>
            <td>M</td>
            <td>34 anos</td>
            <td>Professor</td>
        </tr>
        <tr>
            <td>Guilherme Santos</td>
            <td>M</td>
            <td>22 anos</td>
            <td>Programador</td>
        </tr>
    </table>
</body>
</html>
