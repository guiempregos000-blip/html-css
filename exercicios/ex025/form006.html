<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <style>
        img#minhaImagem{
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <h1>Exemplo de formulario</h1>
    <form action="cadastro.php" method="post">
        <p>
            <label for="icor">Cor: </label>
            <input type="color" name="Cor" id="icor" value="#00ff00">
        </p>

        <p>
            <label for="inivel">Nivel de satisfação: </label>
            <input type="range" name="nivel" id="inivel" min="1" max="5">
        </p>

        <p>
            <label for="iimage">imagem: </label>
            <input type="file" name="image" id="iimage">
            <img id="minhaImagem" src="" alt="Pré-vizualização" width="100%">
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>

    <script>
        const inputImagem = document.getElementById('iimage');
const minhaImagem = document.getElementById('minhaImagem');

inputImagem.addEventListener('change', function(evento) {
  const arquivo = evento.target.files[0];
  
  if (arquivo) {
    // Cria uma URL temporária para o arquivo selecionado
    minhaImagem.src = URL.createObjectURL(arquivo);
  }
});
    </script>
</body>
</html>
