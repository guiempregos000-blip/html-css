<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
        }

        div.conteiner {
            background-color: lightcoral;

            display: flex;
            flex-flow: row nowrap;
        }

        div.item {
            background-color: lightblue;
            border: 1px solid black;
            text-align: center;

            /*flex-basis: 350px;
            flex-shrink: 1;
            flex-grow: 1;*/
        }

        #n1 {
            /*flex-basis: 150px;
            flex-grow: 0;
            flex-shrink: 1;*/
            flex: 0 1 150px;
        }

        #n2{
            /*flex-basis: 150px;
            flex-grow: 2;
            flex-shrink: 0;*/
            flex: 2 0 150px;
        }

        #n3 {
            /*flex-basis: 150px;
            flex-grow: 1;
            flex-shrink: 2;*/
            flex: 1 2 150px;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item" id="n1">A</div>
        <div class="item" id="n2">B</div>
        <div class="item" id="n3">C</div>
    </div>
</body>
</html>
